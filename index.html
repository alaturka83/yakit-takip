<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Yakıt Takip</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yakıt Takip">
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--tx:#1b1e24;--mut:#6b7280;--line:#e5e7eb;
  --acc:#e8590c;--acc-soft:#fff1e8;--ok:#15803d;--ok-soft:#e8f6ec;--warn:#b45309;--warn-soft:#fdf3e1;
  --bad:#dc2626;--bad-soft:#fdecec;--blue:#2563eb;--blue-soft:#eaf1fe;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111318;--card:#1b1e25;--tx:#eceef2;--mut:#9aa1ad;--line:#2c3039;
    --acc:#ff7a33;--acc-soft:#2b1c13;--ok:#4ade80;--ok-soft:#14261b;--warn:#fbbf24;--warn-soft:#2a2213;
    --bad:#f87171;--bad-soft:#2c1717;--blue:#60a5fa;--blue-soft:#15213a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{display:block;font-size:17px}
.brand small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px 4px 4px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.abtn.pri{background:var(--acc);border-color:var(--acc);color:#fff;padding:7px 14px}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;position:relative;flex-shrink:0}
.av i{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card);background:#9ca3af}
.av i.ok{background:#16a34a}.av i.off{background:#f59e0b}
.card.tight{padding:2px 14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow b{display:block;font-size:14.5px}
.srow small{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.srow>div{min-width:0}
details.card summary{padding:11px 0;cursor:pointer;font-weight:600;font-size:14.5px}
details.card .tips{margin-top:0}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--mut);cursor:pointer;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#9ca3af;display:inline-block}
.sync.ok i{background:#16a34a}.sync.off i{background:#f59e0b}.sync.err i{background:#dc2626}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut);cursor:pointer}
nav button svg{width:23px;height:23px}
nav button.active{color:var(--acc);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px 16px 150px}
.page{display:none}.page.active{display:block}
h2.pt{font-size:20px;margin:4px 0 14px}
h3{font-size:15.5px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--mut)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--mut);margin-left:3px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.hl{background:var(--acc-soft);border-color:transparent}
.kpi.hl .v{color:var(--acc)}
.up{color:var(--bad)}.down{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:25;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(232,89,12,.4);cursor:pointer}
.erow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.erow:first-child{border-top:0}
.ed{width:48px;flex-shrink:0;text-align:center;background:var(--bg);border-radius:10px;padding:6px 0;align-self:flex-start}
.ed b{display:block;font-size:18px;line-height:1.1}
.ed span{font-size:11px;color:var(--mut)}
.em{flex:1;min-width:0}
.et{font-size:15px}
.es{font-size:13px;color:var(--mut)}
.eb{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.bdg{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mut);font-weight:600}
.bdg.km{background:var(--blue-soft);color:var(--blue)}
.bdg.l{background:var(--acc-soft);color:var(--acc)}
.bdg.c{background:var(--ok-soft);color:var(--ok)}
.bdg.p{background:var(--warn-soft);color:var(--warn)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 6px;font-weight:700}
.mh span{font-size:13px;color:var(--mut);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.rem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px}
.rem.w{background:var(--warn-soft);color:var(--warn)}
.rem.b{background:var(--bad-soft);color:var(--bad)}
.rem.o{background:var(--ok-soft);color:var(--ok)}
.tips{padding-left:18px;color:var(--mut);margin:8px 0 16px}
.tips li{margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--mut);font-size:11.5px}
.empty-chart{color:var(--mut);font-size:13.5px;padding:24px 0;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-weight:600;font-size:12.5px;border-top:0}
.tw{overflow-x:auto}
/* form */
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f .w2{grid-column:1/-1}
.f>div{min-width:0}
label.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc);background:var(--card)}
.in.calc{border-color:var(--ok);background:var(--ok-soft)}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px;min-height:1em}
.hint b{color:var(--blue)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px}
.sw small{display:block;color:var(--mut);font-size:12.5px}
.tog{position:relative;width:50px;height:30px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog span{position:absolute;inset:0;background:#c5c9d0;border-radius:99px;transition:.2s;cursor:pointer}
.tog span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span:before{transform:translateX(20px)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden,.viewer.hidden{display:none}
.sheet-box{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:18px}
.x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
.prev{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--mut);margin-top:12px}
.prev b{color:var(--tx)}
/* photos */
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ptile{aspect-ratio:4/3;border-radius:14px;border:2px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;overflow:hidden;position:relative;color:var(--mut);font-size:13px;font-weight:600;padding:0}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile.has{border-style:solid;border-color:transparent}
.ptile .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12.5px;text-align:left}
.ptile .plus{font-size:26px;line-height:1}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.viewer .vi{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.viewer .vb{display:flex;gap:10px;justify-content:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
.viewer .vt{color:#fff;text-align:center;padding:calc(14px + env(safe-area-inset-top)) 14px 0;font-weight:600}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px}
.vlist div{padding:7px 0;border-top:1px solid var(--line)}
.vlist span{display:block;font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--mut)}
.small{font-size:13px}
.st{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}
/* ===== İstatistik mini kutular ===== */
.kpis.mini{grid-template-columns:repeat(4,1fr);gap:6px}
.kpis.mini .kpi{padding:7px 8px;border-radius:10px}
.kpis.mini .l{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis.mini .v{font-size:15px;letter-spacing:-.3px;white-space:nowrap}
.kpis.mini .v small{font-size:10px;margin-left:2px}
.kpis.mini .s{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.kpis.mini .v{font-size:14px}}
/* ===== Yakıt formu araç kartı ===== */
.efv{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:7px 9px}
.efv .vth{width:44px;height:44px;border-radius:9px}
.efv .vth svg{width:22px;height:22px}
.efv b{font-size:15px}
.efv .es{font-size:12px}
/* ===== Klavye açılınca form görünür kalsın ===== */
.sheet{height:var(--vvh,100dvh);bottom:auto}
.sheet-box{max-height:calc(var(--vvh,100dvh) - 12px);overscroll-behavior:contain}
/* ===== Araç listesi ===== */
.vcard{display:flex;align-items:center;gap:11px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.vth{width:54px;height:54px;border-radius:11px;background:var(--acc-soft);color:var(--acc);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vth img{width:100%;height:100%;object-fit:cover}
.vth svg{width:26px;height:26px}
.vi2{flex:1;min-width:0}
.vi2 b{font-size:15.5px;letter-spacing:.2px}
.vi2 .es{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:24px;color:var(--mut);line-height:1}
.vadd{width:100%;border:2px dashed var(--line);background:transparent;border-radius:14px;padding:13px;font-weight:700;color:var(--acc);cursor:pointer;font-size:14.5px}
.bk{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.vlist.v2{grid-template-columns:1fr 1fr}
.vlist .w3{grid-column:1/-1}
.vch .chip{font-weight:600}
/* ===== Kompakt düzen ===== */
body{font-size:14.5px}
header{padding:7px 14px;padding-top:calc(7px + env(safe-area-inset-top))}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:16px}
.brand small{font-size:12px}
main{padding:12px 12px 140px}
h2.pt{font-size:18px;margin:2px 2px 10px}
h3{font-size:14.5px;margin:0 0 8px}
.card{padding:12px;border-radius:14px;margin-bottom:10px}
.kpis{gap:8px;margin-bottom:10px}
.kpi{padding:9px 11px;border-radius:12px}
.kpi .l{font-size:12px}
.kpi .v{font-size:19px;margin-top:0}
.kpi .v small{font-size:12px}
.kpi .s{font-size:11.5px;margin-top:1px;line-height:1.3}
.btn{padding:9px 14px;border-radius:11px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
#fab{padding:11px 17px;font-size:15px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom))}
.erow{gap:10px;padding:9px 0}
.ed{width:40px;padding:4px 0;border-radius:9px}
.ed b{font-size:16px}
.ed span{font-size:10.5px}
.et{font-size:14px}
.es{font-size:12.5px}
.eb{gap:4px;margin-top:4px}
.bdg{font-size:11.5px;padding:1px 7px}
.mh{margin:12px 2px 5px;font-size:14px}
.mh span{font-size:12.5px}
.chips{gap:5px;margin-bottom:10px}
.chip{padding:5px 11px;font-size:13px}
.rem{padding:8px 11px;border-radius:11px;margin-bottom:8px;font-size:13px;gap:8px}
.tips{font-size:13.5px}
table.t{font-size:13px}
table.t th,table.t td{padding:6px 5px}
table.t th{font-size:11.5px}
.f{gap:8px 10px}
label.fl{font-size:12px;margin-bottom:3px}
.in{padding:8px 10px;border-radius:10px}
.hint{font-size:11.5px;margin-top:3px}
.sw{padding:8px 10px;border-radius:11px}
.sw b{font-size:14px}
.sw small{font-size:11.5px}
.tog{width:44px;height:26px}
.tog span:before{width:20px;height:20px}
.tog input:checked+span:before{transform:translateX(18px)}
.sheet-box{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet-head{margin-bottom:10px}
.sheet-head h3{font-size:16.5px}
.x{width:32px;height:32px;font-size:18px}
.prev{padding:8px 10px;font-size:12.5px;margin-top:10px}
.ph{grid-template-columns:repeat(4,1fr);gap:8px}
.ptile{aspect-ratio:1;border-radius:11px;font-size:11px;gap:2px;text-align:center;line-height:1.2}
.ptile .plus{font-size:20px}
.ptile .cap{font-size:10.5px;padding:4px 5px}
.vlist{grid-template-columns:repeat(3,1fr);gap:0 10px;font-size:13.5px}
.vlist div{padding:6px 0}
.vlist span{font-size:11px}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.lh h3{margin:0}
.lh span{font-size:12px;color:var(--mut)}
.srow{padding:9px 0}
.srow b{font-size:14px}
.srow small{font-size:12px}
details.card summary{padding:9px 0;font-size:14px}
.chart text{font-size:10.5px}
@media (min-width:700px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .f.v3{grid-template-columns:1fr 1fr 1fr}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .g2>.card{margin-bottom:0}
}
@media (min-width:900px){
  nav{position:sticky;top:58px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;padding:4px}
  nav button{flex:0 0 auto;flex-direction:row;gap:8px;padding:9px 16px;font-size:14px;border-radius:10px}
  nav button svg{width:19px;height:19px}
  nav button.active{background:var(--acc-soft)}
  #fab{bottom:28px;right:28px}
  main{padding-bottom:110px}
  .sheet{align-items:center}
  .sheet-box{border-radius:20px}
  #toast{bottom:40px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="icon-192.png" alt="">
    <div><b>Yakıt Takip</b><small id="hdrSub">Araç bilgisi eklenmedi</small></div>
  </div>
  <div id="authBox"></div>
</header>

<nav id="nav">
  <button data-p="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Özet</button>
  <button data-p="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Geçmiş</button>
  <button data-p="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>İstatistik</button>
  <button data-p="vehicle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5M3 12h18"/></svg>Araçlarım</button>

<script src="config.js"></script>
<script>
/* ============ Yardımcılar ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => (isFinite(n) ? n : 0).toLocaleString('tr-TR', {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtInt = n => Math.round(n).toLocaleString('tr-TR');
const money = n => fmt(n, 2) + ' ₺';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AY_K = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dTR = s => s ? s.split('-').reverse().join('.') : '';
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clean = o => JSON.parse(JSON.stringify(o));
function parseDec(v){
  if (typeof v === 'number') return v;
  v = String(v || '').trim().replace(/\s|₺/g, '');
  if (!v) return NaN;
  if (v.includes(',') && v.includes('.')) v = v.replace(/\./g, '').replace(',', '.');
  else if (v.includes(',')) v = v.replace(',', '.');
  return parseFloat(v);
}
const parseKm = v => parseInt(String(v || '').replace(/\D/g, ''), 10);
const toIn = (n, d = 2) => isFinite(n) ? n.toFixed(d).replace('.', ',') : '';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

/* ============ Yerel depolama ============ */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Cihaz hafızası dolu, kayıt yapılamadı!'); } }
};
const MAIN = 'v-main';   // tek araçlı eski sürümden taşınan aracın kimliği
let entries = LS.get('yt_entries', {});
let vehicles = LS.get('yt_vehicles', {});
let activeVid = LS.get('yt_active', null);
let photos = {};
(function migrateOld(){
  const old = LS.get('yt_vehicle', null);
  if (old && old.plaka && !vehicles[MAIN]){ vehicles[MAIN] = {...old, id: MAIN, createdAt: 0}; LS.set('yt_vehicles', vehicles); }
})();
const saveEntries = () => LS.set('yt_entries', entries);
const saveVehicles = () => LS.set('yt_vehicles', vehicles);

const idb = {
  db: null,
  open(){ return new Promise(res => { try {
    const r = indexedDB.open('yakit-takip', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => res();
  } catch(e){ res(); } }); },
  all(){ return new Promise(res => { if (!this.db) return res({}); const out = {};
    const c = this.db.transaction('photos').objectStore('photos').openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } else res(out); };
    c.onerror = () => res(out); }); },
  put(k, v){ return new Promise(res => { if (!this.db) return res();
    const tx = this.db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(v, k);
    tx.oncomplete = res; tx.onerror = res; }); }
};

/* ============ Araçlar (ortak) ============ */
const vehList = () => Object.values(vehicles).filter(v => !v.deleted)
  .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) || String(a.plaka).localeCompare(String(b.plaka)));
const hasVehicle = () => vehList().length > 0;
const multiVeh = () => vehList().length > 1;
const vidOf = e => e.vehicleId || MAIN;
function curVid(){
  const L = vehList(); if (!L.length) return null;
  if (!L.some(v => v.id === activeVid)) activeVid = L[0].id;
  return activeVid;
}
const curVeh = () => vehicles[curVid()] || null;
function setActive(id){ activeVid = id; LS.set('yt_active', id); renderAll(); }
const pkey = (vid, slot) => vid + '_' + slot;
const normPKey = k => k.includes('_') ? k : MAIN + '_' + k;
const vehName = v => [v.marka, v.model].filter(Boolean).join(' ');

/* ============ Hesaplamalar ============ */
const activeList = (vid = curVid()) => Object.values(entries).filter(e => !e.deleted && vidOf(e) === vid)
  .sort((a, b) => a.km - b.km || a.date.localeCompare(b.date));

function compute(vid = curVid()){
  const L = activeList(vid), res = {}, segs = [];
  let lf = -1, accL = 0, accC = 0;
  L.forEach((e, i) => {
    const r = {};
    if (i > 0){ r.diffKm = e.km - L[i-1].km; r.days = dayDiff(L[i-1].date, e.date); }
    if (e.full){
      if (lf >= 0){
        const km = e.km - L[lf].km, lit = accL + e.liters, cost = accC + e.total;
        if (km > 0){
          r.segKm = km; r.l100 = lit / km * 100; r.tlkm = cost / km;
          segs.push({id: e.id, date: e.date, km, lit, cost, l100: r.l100, tlkm: r.tlkm});
        }
      } else r.first = true;
      lf = i; accL = 0; accC = 0;
    } else {
      r.partial = true;
      if (lf >= 0){ accL += e.liters; accC += e.total; }
    }
    res[e.id] = r;
  });
  return {L, res, segs};
}
function segTotals(segs){
  const km = segs.reduce((s, x) => s + x.km, 0), lit = segs.reduce((s, x) => s + x.lit, 0), cost = segs.reduce((s, x) => s + x.cost, 0);
  return {km, lit, cost, l100: km ? lit / km * 100 : NaN, tlkm: km ? cost / km : NaN};
}

/* ============ Gezinme ============ */
let page = 'home';
function go(p){
  page = p;
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('active', s.id === 'p-' + p));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  $('#fab').style.display = (p === 'home' || p === 'history') ? '' : 'none';
  window.scrollTo(0, 0);
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  if (b.dataset.p === 'vehicle'){ vehView = {mode: 'list', id: null}; vehDirty = false; renderVehicle(); }
  go(b.dataset.p);
});

function renderAll(){
  renderHeader(); renderHome(); renderHistory(); renderStats();
  if (!vehDirty) renderVehicle();
  renderSettings();
}
function renderHeader(){
  const v = curVeh();
  $('#hdrSub').textContent = v ? [v.plaka, vehName(v)].filter(Boolean).join(' · ') : 'Araç eklenmedi';
}

/* ============ Ortak parçalar ============ */
const kpi = (l, v, u, s = '', hl = false) =>
  `<div class="kpi${hl ? ' hl' : ''}"><div class="l">${l}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;

function vehChips(){
  if (!multiVeh()) return '';
  const cur = curVid();
  return `<div class="chips vch">${vehList().map(v => `<button class="chip ${v.id === cur ? 'on' : ''}" onclick="setActive('${v.id}')">🚗 ${esc(v.plaka)}</button>`).join('')}</div>`;
}

function entryRow(e, r = {}){
  const [y, m, d] = e.date.split('-');
  const b = [];
  if (r.diffKm != null) b.push(`<span class="bdg km">+${fmtInt(r.diffKm)} km</span>`);
  if (r.l100 != null) b.push(`<span class="bdg l">${fmt(r.l100, 1)} L/100 km</span>`);
  if (r.tlkm != null) b.push(`<span class="bdg c">${fmt(r.tlkm, 2)} ₺/km</span>`);
  if (r.partial) b.push(`<span class="bdg p">Kısmi alım</span>`);
  if (r.first) b.push(`<span class="bdg">İlk full</span>`);
  return `<div class="erow" onclick="openEntry('${e.id}')">
    <div class="ed"><b>${+d}</b><span>${AY_K[+m-1]} ${y.slice(2)}</span></div>
    <div class="em">
      <div class="et"><b>${fmt(e.liters, 2)} L</b> · ${money(e.total)}</div>
      <div class="es">${fmt(e.price, 2)} ₺/L · ${fmtInt(e.km)} km${e.station ? ' · ' + esc(e.station) : ''}</div>
      ${e.note ? `<div class="es">📝 ${esc(e.note)}</div>` : ''}
      ${b.length ? `<div class="eb">${b.join('')}</div>` : ''}
    </div></div>`;
}

const DOCS = [['muayene','Muayene'],['sigorta','Trafik sigortası'],['kasko','Kasko']];
function remindersHTML(list = vehList(), all = false){
  const out = [], t = todayStr(), multi = multiVeh();
  list.forEach(v => DOCS.forEach(([k, n]) => {
    if (!v[k]) return;
    const left = dayDiff(t, v[k]), who = (multi ? esc(v.plaka) + ' · ' : '') + n;
    if (left < 0) out.push(`<div class="rem b">⚠️ <div><b>${who}</b> süresi ${-left} gün önce doldu (${dTR(v[k])})</div></div>`);
    else if (left <= 30) out.push(`<div class="rem w">⏰ <div><b>${who}</b> bitişine ${left} gün kaldı (${dTR(v[k])})</div></div>`);
    else if (all) out.push(`<div class="rem o">✓ <div><b>${n}</b> geçerli · ${left} gün kaldı (${dTR(v[k])})</div></div>`);
  }));
  return out.join('');
}
const warnCount = v => DOCS.filter(([k]) => v[k] && dayDiff(todayStr(), v[k]) <= 30).length;

/* ============ Özet ============ */
function renderHome(){
  const el = $('#p-home');
  if (!hasVehicle()){
    el.innerHTML = `<div class="card">
      <h2 style="margin:0 0 6px">Hoş geldin 👋</h2>
      <p class="muted" style="margin:0 0 14px">Başlamak için önce aracını tanımla. Plaka yeterli, diğer bilgileri sonra da ekleyebilirsin.</p>
      <button class="btn pri" onclick="newVeh()">🚗 Araç ekle</button></div>`;
    return;
  }
  const {L, res, segs} = compute();
  if (!L.length){
    el.innerHTML = vehChips() + remindersHTML() + `<div class="card">
      <h2 style="margin:0 0 6px">${esc(curVeh().plaka)} hazır 👍</h2>
      <p class="muted" style="margin:0">İlk yakıt alımını ekleyerek başla.</p>
      <ul class="tips">
        <li>Mümkün olduğunca depoyu <b>full</b> doldurduğun alımları kaydet. Tüketim iki full alım arasında hesaplanır.</li>
        <li>Kilometreyi göstergedeki <b>toplam km</b> sayacından yaz.</li>
        <li>Litre, litre fiyatı ve tutardan herhangi ikisini yazman yeterli.</li>
      </ul>
      <button class="btn pri" onclick="openEntry()">+ İlk alımı ekle</button></div>`;
    return;
  }
  const last = L[L.length - 1], tot = segTotals(segs), lastSeg = segs[segs.length - 1];
  const ym = todayStr().slice(0, 7), mE = L.filter(e => e.date.startsWith(ym));
  const mSpent = mE.reduce((s, e) => s + e.total, 0), mLit = mE.reduce((s, e) => s + e.liters, 0);
  let cmp = '';
  if (lastSeg && segs.length > 1 && isFinite(tot.l100)){
    const p = (lastSeg.l100 - tot.l100) / tot.l100 * 100;
    cmp = Math.abs(p) < 1 ? 'Ortalamayla aynı' : `<span class="${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} %${fmt(Math.abs(p), 0)}</span> ortalamaya göre`;
  }
  const since = dayDiff(last.date, todayStr());
  el.innerHTML = vehChips() + remindersHTML() + `
    <div class="kpis">
      ${kpi('Son tüketim', lastSeg ? fmt(lastSeg.l100, 1) : '—', 'L/100 km', lastSeg ? cmp || 'İlk ölçüm' : 'İkinci full alımda hesaplanır', true)}
      ${kpi('Ortalama tüketim', isFinite(tot.l100) ? fmt(tot.l100, 1) : '—', 'L/100 km', segs.length ? `${segs.length} ölçüm, ${fmtInt(tot.km)} km` : '')}
      ${kpi('Km başı maliyet', lastSeg ? fmt(lastSeg.tlkm, 2) : '—', '₺/km', isFinite(tot.tlkm) ? `Ortalama ${fmt(tot.tlkm, 2)} ₺/km` : '')}
      ${kpi(AYLAR[new Date().getMonth()] + ' harcaması', fmt(mSpent, 0), '₺', mE.length ? `${mE.length} alım · ${fmt(mLit, 1)} L` : 'Bu ay alım yok')}
    </div>
    <div class="card">
      <div class="lh"><h3>Son alım</h3><span>${dTR(last.date)} · ${since === 0 ? 'bugün' : since + ' gün önce'}</span></div>
      <div class="vlist">
        <div><span>Alınan</span>${fmt(last.liters, 2)} L</div>
        <div><span>Tutar</span>${money(last.total)}</div>
        <div><span>Litre fiyatı</span>${fmt(last.price, 2)} ₺</div>
        <div><span>Kilometre</span>${fmtInt(last.km)}</div>
        <div><span>Önceki alımdan</span>${res[last.id].diffKm != null ? '+' + fmtInt(res[last.id].diffKm) + ' km' : '—'}</div>
        <div><span>Depo</span>${last.full ? 'Full' : 'Kısmi'}</div>
      </div>
    </div>
    <div class="card">
      <div class="lh"><h3>Son alımlar</h3><button class="btn sm" onclick="go('history')">Tümü</button></div>
      <div>${L.slice(-5).reverse().map(e => entryRow(e, res[e.id])).join('')}</div>
    </div>`;
}

/* ============ Geçmiş ============ */
let histYear = 'all';
function renderHistory(){
  const el = $('#p-history');
  if (!hasVehicle()){ el.innerHTML = `<h2 class="pt">Geçmiş</h2><div class="card muted">Önce bir araç ekle.</div>`; return; }
  const {L, res} = compute();
  if (!L.length){ el.innerHTML = `<h2 class="pt">Geçmiş</h2>${vehChips()}<div class="card muted">Bu araç için henüz kayıt yok.</div>`; return; }
  const years = [...new Set(L.map(e => e.date.slice(0, 4)))].sort().reverse();
  if (histYear !== 'all' && !years.includes(histYear)) histYear = 'all';
  const list = L.filter(e => histYear === 'all' || e.date.startsWith(histYear)).reverse();
  const groups = {};
  list.forEach(e => (groups[e.date.slice(0, 7)] ||= []).push(e));
  const html = Object.keys(groups).sort().reverse().map(ym => {
    const g = groups[ym].sort((a, b) => b.km - a.km), [y, m] = ym.split('-');
    const sum = g.reduce((s, e) => s + e.total, 0), lit = g.reduce((s, e) => s + e.liters, 0);
    return `<div class="mh">${AYLAR[+m-1]} ${y}<span>${fmt(lit, 1)} L · ${money(sum)}</span></div>
      <div class="card" style="padding:2px 12px">${g.map(e => entryRow(e, res[e.id])).join('')}</div>`;
  }).join('');
  el.innerHTML = `<h2 class="pt">Geçmiş <span class="muted small">(${L.length} kayıt)</span></h2>
    ${vehChips()}
    <div class="chips"><button class="chip ${histYear === 'all' ? 'on' : ''}" onclick="histYear='all';renderHistory()">Tümü</button>
    ${years.map(y => `<button class="chip ${histYear === y ? 'on' : ''}" onclick="histYear='${y}';renderHistory()">${y}</button>`).join('')}</div>
    ${html}`;
}

/* ============ Grafikler ============ */
function lineChart(pts, {color = 'var(--acc)', d = 1, unit = '', w = 640} = {}){
  if (pts.length < 2) return '<div class="empty-chart">Grafik için en az 2 veri gerekli.</div>';
  const W = Math.round(w), H = w < 500 ? 160 : 200, pl = 40, pr = 10, pt = 14, pb = 24;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx){ mn -= 1; mx += 1; }
  const pad = (mx - mn) * .12; mn -= pad; mx += pad;
  const X = i => pl + (W - pl - pr) * i / (pts.length - 1), Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let k = 0; k <= 3; k++){ const v = mn + (mx - mn) * k / 3, y = Y(v);
    g += `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${fmt(v, d)}</text>`; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = path + ` L${X(pts.length - 1)} ${H - pb} L${pl} ${H - pb} Z`;
  const idx = [...new Set([0, Math.floor((pts.length - 1) / 2), pts.length - 1])];
  const xl = idx.map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${pts[i].x}</text>`).join('');
  const dots = pts.length <= 40 ? pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="${color}"><title>${p.x}: ${fmt(p.y, d)} ${unit}</title></circle>`).join('') : '';
  const lp = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}">${g}<path d="${area}" fill="${color}" opacity=".08"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${X(pts.length - 1) - 6}" y="${Y(lp.y) - 10}" text-anchor="end" style="fill:var(--tx);font-weight:700">${fmt(lp.y, d)}</text>${xl}</svg>`;
}
function barChart(bars, {color = 'var(--acc)', w = 640} = {}){
  if (!bars.some(b => b.y > 0)) return '<div class="empty-chart">Bu dönemde veri yok.</div>';
  const W = Math.round(w), H = w < 500 ? 160 : 200, pl = 40, pr = 4, pt = 14, pb = 24, mx = Math.max(...bars.map(b => b.y)) * 1.12;
  const bw = (W - pl - pr) / bars.length, Y = v => pt + (H - pt - pb) * (1 - v / mx);
  let g = '';
  for (let k = 0; k <= 3; k++){ const v = mx * k / 3, y = Y(v);
    g += `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${fmtInt(v)}</text>`; }
  const r = bars.map((b, i) => {
    const x = pl + bw * i + bw * .18, w = bw * .64, y = Y(b.y);
    return `<rect x="${x}" y="${y}" width="${w}" height="${H - pb - y}" rx="4" fill="${color}"><title>${b.x}: ${money(b.y)}</title></rect>
      <text x="${x + w / 2}" y="${H - 7}" text-anchor="middle">${b.x}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${g}${r}</svg>`;
}

function compressImage(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let {width: w, height: h} = img; const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

function autoCalc(changed){
  const f = F();

  const L = parseDec(f.liters.value), P = parseDec(f.price.value), T = parseDec(f.total.value);
  const has = new Set(lastEdited);
  ['liters','price','total'].forEach(k => f[k].classList.remove('calc'));

  if (has.has('liters') && has.has('price') && L > 0 && P > 0){ f.total.value = toIn(L * P); f.total.classList.add('calc'); }
  else if (has.has('liters') && has.has('total') && L > 0 && T > 0){ f.price.value = toIn(T / L); f.price.classList.add('calc'); }

}

  if (!km){ hint.innerHTML = last ? `Son kayıt: ${fmtInt(last.km)} km` : ''; $('#efPrev').style.display = 'none'; return; }
  const prev = L.filter(e => e.km < km).pop();
  hint.innerHTML = prev ? `Önceki alımdan beri <b>+${fmtInt(km - prev.km)} km</b>` : (last ? `<span style="color:var(--bad)">Son kayıttan (${fmtInt(last.km)}) küçük!</span>` : 'Bu aracın ilk kaydı');
  const lit = parseDec(f.liters.value), tot = parseDec(f.total.value);
  let txt = '';
  if (f.full.checked && lit > 0){
    const before = L.filter(e => e.km < km);
    let i = before.length - 1, accL = lit, accC = tot > 0 ? tot : 0;
    while (i >= 0 && !before[i].full){ accL += before[i].liters; accC += before[i].total; i--; }
    if (i >= 0){ const seg = km - before[i].km;
      if (seg > 0) txt = `Bu alımla tüketim: <b>${fmt(accL / seg * 100, 1)} L/100 km</b>${accC ? ` · <b>${fmt(accC / seg, 2)} ₺/km</b>` : ''} <span>(${fmtInt(seg)} km)</span>`; }
    else txt = 'Bu ilk full alım. Tüketim bir sonraki full alımda hesaplanacak.';
  } else if (!f.full.checked) txt = 'Kısmi alım: litreler bir sonraki full alımın hesabına eklenecek.';
  $('#efPrev').innerHTML = txt; $('#efPrev').style.display = txt ? '' : 'none';
}
$('#ef').onsubmit = ev => {
  ev.preventDefault();
  const f = F();
  if (!efVid || !vehicles[efVid]) return toast('Araç seç');
  const e = {
    id: editId || newId(), vehicleId: efVid, date: f.date.value, km: parseKm(f.km.value),
    liters: parseDec(f.liters.value), price: parseDec(f.price.value), total: parseDec(f.total.value),
    full: f.full.checked, station: f.station.value.trim(), note: f.note.value.trim(), updatedAt: Date.now()

  if (!e.date) return toast('Tarih gir');
  if (!(e.km > 0)) return toast('Kilometre gir');
  if (!(e.total > 0) && e.liters > 0 && e.price > 0) e.total = e.liters * e.price;
  if (!(e.price > 0) && e.liters > 0 && e.total > 0) e.price = e.total / e.liters;

function exportCSV(){

$('#importInput').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'yakit-takip' || !d.entries) throw 0;
    if (!confirm(`${Object.values(d.entries).filter(x => !x.deleted).length} kayıt içeren yedek yüklensin mi? Mevcut kayıtlarla birleştirilir.`)) return;
    const vs = {...(d.vehicles || {})};
    if (d.vehicle && d.vehicle.plaka && !vs[MAIN]) vs[MAIN] = {...d.vehicle, id: MAIN, createdAt: 0};
    for (const [k, v] of Object.entries(vs)){ const l = vehicles[k]; if (!l || (v.updatedAt || 0) >= (l.updatedAt || 0)){ vehicles[k] = v; pushVehicle(k); } }
    for (const [k, e] of Object.entries(d.entries)){ const l = entries[k]; if (!l || (e.updatedAt || 0) >= (l.updatedAt || 0)){ entries[k] = e; pushEntry(e); } }
    saveVehicles(); saveEntries();
    for (const [k0, p] of Object.entries(d.photos || {})){ const k = normPKey(k0), l = photos[k]; if (!l || (p.updatedAt || 0) >= (l.updatedAt || 0)){ photos[k] = p; await idb.put(k, p); pushPhoto(k); } }
    vehDirty = false; vehView = {mode: 'list', id: null}; renderAll(); toast('Yedek yüklendi');
  } catch(e){ toast('Geçersiz yedek dosyası'); }
};

      <span class="av">${esc((u.email || '?')[0].toLocaleUpperCase('tr-TR'))}<i class="${sync.connected ? 'ok' : 'off'}"></i></span>Çıkış</button>`;
}
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function initFirebase(){
  const c = window.FIREBASE_CONFIG;
  if (!c || !c.apiKey || /BURAYA/.test(c.apiKey) || !c.databaseURL){ sync.mode = 'none'; updSync(); return; }
  sync.mode = 'loading'; updSync(); renderSettings();
  try {
    const b = 'https://www.gstatic.com/firebasejs/10.14.1/';
    await loadScript(b + 'firebase-app-compat.js');
    await loadScript(b + 'firebase-auth-compat.js');
    await loadScript(b + 'firebase-database-compat.js');
    firebase.initializeApp(c);
    sync.mode = 'ready';
    firebase.auth().onAuthStateChanged(u => { detach(); sync.user = u; if (u) attach(); updSync(); renderSettings(); });
  } catch(e){ sync.mode = 'error'; }
  updSync(); renderSettings();
}
const fbRef = p => firebase.database().ref(`users/${sync.user.uid}/${p}`);
function attach(){
  const con = firebase.database().ref('.info/connected');
  con.on('value', s => { sync.connected = !!s.val(); updSync(); if (page === 'settings') renderSettings(); });
  const er = fbRef('entries'), vr = fbRef('vehicles'), lr = fbRef('vehicle'), pr = fbRef('photos');
  vr.on('value', s => mergeVehicles(s.val() || {}));
  lr.on('value', s => mergeLegacyVehicle(s.val()));
  er.on('value', s => mergeEntries(s.val() || {}));
  pr.on('value', s => mergePhotos(s.val() || {}));
  sync.refs = [con, vr, lr, er, pr];
}
function detach(){ sync.refs.forEach(r => r.off()); sync.refs = []; sync.connected = false; }
const fail = e => console.warn('Firebase yazma hatası', e);
function pushEntry(e){ if (sync.user) fbRef('entries/' + e.id).set(clean(e)).catch(fail); }
function pushVehicle(id){ if (sync.user && vehicles[id]) fbRef('vehicles/' + id).set(clean(vehicles[id])).catch(fail); }
function pushPhoto(k){ if (sync.user && photos[k]) fbRef('photos/' + k).set(clean(photos[k])).catch(fail); }
function mergeEntries(remote){
  let ch = false;
  for (const [k, r] of Object.entries(remote)){ const l = entries[k]; if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ entries[k] = r; ch = true; } }
  for (const [k, l] of Object.entries(entries)){ const r = remote[k]; if (!r || (l.updatedAt || 0) > (r.updatedAt || 0)) pushEntry(l); }
  if (ch){ saveEntries(); renderAll(); }
  sync.last = Date.now(); if (page === 'settings') renderSettings();
}
function mergeVehicles(remote){
  let ch = false;
  for (const [k, r] of Object.entries(remote)){ const l = vehicles[k]; if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ vehicles[k] = r; ch = true; } }
  for (const [k, l] of Object.entries(vehicles)){ const r = remote[k]; if (!r || (l.updatedAt || 0) > (r.updatedAt || 0)) pushVehicle(k); }
  if (ch){ saveVehicles(); renderAll(); }
}
function mergeLegacyVehicle(r){   // eski sürümün tek araç kaydı
  if (r && r.plaka && !vehicles[MAIN]){ vehicles[MAIN] = {...r, id: MAIN, createdAt: 0}; saveVehicles(); pushVehicle(MAIN); renderAll(); }
}
async function mergePhotos(remote){
  let ch = false;
  for (const [k0, r] of Object.entries(remote)){ const k = normPKey(k0), l = photos[k];
    if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ photos[k] = r; await idb.put(k, r); ch = true; } }
  for (const [k, l] of Object.entries(photos)){ const r = remote[k]; if (!r || (l.updatedAt || 0) > (r.updatedAt || 0)) pushPhoto(k); }
  if (ch && !vehDirty) renderVehicle();
}

/* ============ Başlat ============ */
(async function(){
  await idb.open();
  const raw = await idb.all();
  for (const [k, v] of Object.entries(raw)){ const nk = normPKey(k);
    if (nk !== k){ if (!raw[nk]){ photos[nk] = v; await idb.put(nk, v); } }
    else photos[k] = v; }
  renderAll(); updSync();
  initFirebase();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
